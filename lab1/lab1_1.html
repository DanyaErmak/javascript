<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пенсионный калькулятор</title>
</head>
<body>
    <form id="f">
        <p>
            <label>
                Возраст: 
                <input id="ageinput" required>
            </label>
        </p>
        <div>
            <label><input id="malegender" type="radio" name="genderradio">Мужчина</label>
            <label><input type="radio" name="genderradio" required>Женщина</label>
        </div>

        <p>
            <label>
            <textarea id="result" autocomplete="off" readonly></textarea>
            </label>
        </p>

        <input type="submit" value="Рассчитать">
    </form>

    <script>
        'use strict';

        const f = document.getElementById('f');
        const ageinput = document.getElementById('ageinput');
        const malegender = document.getElementById('malegender');
        const result = document.getElementById('result');

        f.addEventListener('submit', calculate);
        
        function calculate(event){
            event.preventDefault();

            let age = Number(ageinput.value);
            let gender = malegender.checked; 

            if (age >= 0 && age <= 17) {
                result.value = "Вам работать ещё рано — учитесь";
            }
            else if ((age >= 18 && age <= 59 && gender) || (age >= 18 && age <= 54 && !gender)){
                result.value = "Вам ещё работать и работать";
            }
            else if ((age >= 60 && age <= 64 && gender) || (age >= 55 && age <= 59 && !gender)){
                result.value = "Скоро пенсия!";
            }
            else if ((age >= 65 && gender) || (age >= 60 && !gender)){
                result.value = "Вам пора на пенсию";
            }
            else {
                result.value = "Да кто ты такой?";
            }
        }
    </script>
</body>
</html>
