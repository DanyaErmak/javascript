<!DOCTYPE html>
<html lang="ru">
 <head>
  <meta charset="UTF-8">
  <title>Таблица</title>
 </head>
 <body>

  <form id="tableForm">
   <p>
    <label>
     Введите количество строк:
     <input id="rowsInput" type="number" min="1" required>
    </label>
   </p>

   <input type="submit" value="Рисовать">
  </form>

  <script>
   'use strict';

   const tableForm = document.getElementById('tableForm');
   const rowsInput = document.getElementById('rowsInput');

   tableForm.addEventListener('submit', draw);

   function draw(event) {
       event.preventDefault();

       const rowsCount = Number(rowsInput.value);
       const pattern = ['dog', 'dog', 'dog', 'cat', 'cat'];
       const patternLength = pattern.length;
       const colsCount = 6; 

       // Генерируем массив строк, а внутри каждой строки — массив ячеек
       const tableData = Array.from({ length: rowsCount }, (_, rowIndex) => {
           return Array.from({ length: colsCount }, (_, colIndex) => {
               // Вычисляем сквозной индекс без внешней переменной-счетчика
               const globalIndex = rowIndex * colsCount + colIndex;
               return pattern[globalIndex % patternLength];
           });
       });

       tableData.forEach(row => console.log(row.join('\t')));
   }
  </script>

 </body>
</html>
