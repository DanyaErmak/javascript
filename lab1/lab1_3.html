<!DOCTYPE html>
<html lang="ru">
 <head>
  <meta charset="UTF-8">
  <title>Ввод числа</title>
 </head>
 <body>

  <a id="link" href="../index.html">Получить число</a>

  <script>
   'use strict';

   document.getElementById('link').addEventListener('click', goToLink);

   function goToLink(event) {

       if (!getNumber()) {
            event.preventDefault()   
       }

   }

   function getNumber() {

       while (true) {
           let x = prompt('Введите число, большее 100:');

           if (x === null) {
               return false;

           }

           if (x.trim() === '' || isNaN(x.trim())) {
               continue;
           }

           if (Number(x) > 100) {
               return true;
           }
       }

   }
  </script>

 </body>
</html>
